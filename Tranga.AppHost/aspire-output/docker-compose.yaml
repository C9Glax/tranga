services:
  tranga-pg:
    image: "docker.io/library/postgres:18.3"
    environment:
      POSTGRES_HOST_AUTH_METHOD: "scram-sha-256"
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
      POSTGRES_USER: "${POSTGRESUSER}"
      POSTGRES_PASSWORD: "${POSTGRESPASSWORD}"
    expose:
      - "5432"
    networks:
      - "tranga"
  messaging:
    image: "docker.io/library/rabbitmq:4.3"
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQUSER}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQPASSWORD}"
    expose:
      - "5672"
    networks:
      - "tranga"
    healthcheck:
      test:
        - "CMD"
        - "rabbitmq-diagnostics"
        - "-q"
        - "check_port_connectivity"
      interval: "5s"
      timeout: "5s"
      retries: 12
      start_period: "10s"
  services-tasks:
    image: "ghcr.io/c9glax/tranga-services_tasks:external-connectors"
    environment:
      OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY: "in_memory"
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      HTTP_PORTS: "${SERVICES_TASKS_PORT}"
      ConnectionStrings__tranga: "Host=tranga-pg;Port=5432;Username=${POSTGRESUSER};Password=${POSTGRESPASSWORD};Database=tranga"
      TRANGA_HOST: "tranga-pg"
      TRANGA_PORT: "5432"
      TRANGA_USERNAME: "${POSTGRESUSER}"
      TRANGA_PASSWORD: "${POSTGRESPASSWORD}"
      TRANGA_URI: "postgresql://${POSTGRESUSER}:${POSTGRESPASSWORD}@tranga-pg:5432/tranga"
      TRANGA_JDBCCONNECTIONSTRING: "jdbc:postgresql://tranga-pg:5432/tranga"
      TRANGA_DATABASENAME: "tranga"
      ConnectionStrings__messaging: "amqp://${RABBITMQUSER}:${RABBITMQPASSWORD}@messaging:5672"
      MESSAGING_HOST: "messaging"
      MESSAGING_PORT: "5672"
      MESSAGING_USERNAME: "${RABBITMQUSER}"
      MESSAGING_PASSWORD: "${RABBITMQPASSWORD}"
      MESSAGING_URI: "amqp://${RABBITMQUSER}:${RABBITMQPASSWORD}@messaging:5672"
      POSTGRES_HOST: "tranga-pg"
      POSTGRES_PORT: "5432"
      POSTGRES_USER: "${POSTGRESUSER}"
      POSTGRES_PASSWORD: "${POSTGRESPASSWORD}"
      POSTGRES_DATABASE: "tranga"
      RABBITMQ_HOST: "messaging"
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: "tranga"
      RABBITMQ_PASSWORD: "tranga"
      UseAuth: "${USEAUTH}"
      AUTH_SIGNING_KEY: "${AUTHSIGNINGKEY}"
      AllowNSFW: "${ALLOWNSFW}"
      DownloadLanguage: "${DOWNLOADLANGUAGE}"
      FLARESOLVERR_URL: "${FLARESOLVERRURL}"
    expose:
      - "${SERVICES_TASKS_PORT}"
    volumes:
      - type: "bind"
        target: "/app/Mangas"
        source: "${MangaDirectory}"
    depends_on:
      tranga-pg:
        condition: "service_started"
      messaging:
        condition: "service_healthy"
    user: "${PUID:-1000}:${PGID:-1000}"
    networks:
      - "tranga"
    restart: "on-failure:3"
  services-manga:
    image: "ghcr.io/c9glax/tranga-services_manga:external-connectors"
    environment:
      OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY: "in_memory"
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      HTTP_PORTS: "${SERVICES_MANGA_PORT}"
      ConnectionStrings__tranga: "Host=tranga-pg;Port=5432;Username=${POSTGRESUSER};Password=${POSTGRESPASSWORD};Database=tranga"
      TRANGA_HOST: "tranga-pg"
      TRANGA_PORT: "5432"
      TRANGA_USERNAME: "${POSTGRESUSER}"
      TRANGA_PASSWORD: "${POSTGRESPASSWORD}"
      TRANGA_URI: "postgresql://${POSTGRESUSER}:${POSTGRESPASSWORD}@tranga-pg:5432/tranga"
      TRANGA_JDBCCONNECTIONSTRING: "jdbc:postgresql://tranga-pg:5432/tranga"
      TRANGA_DATABASENAME: "tranga"
      ConnectionStrings__messaging: "amqp://${RABBITMQUSER}:${RABBITMQPASSWORD}@messaging:5672"
      MESSAGING_HOST: "messaging"
      MESSAGING_PORT: "5672"
      MESSAGING_USERNAME: "${RABBITMQUSER}"
      MESSAGING_PASSWORD: "${RABBITMQPASSWORD}"
      MESSAGING_URI: "amqp://${RABBITMQUSER}:${RABBITMQPASSWORD}@messaging:5672"
      POSTGRES_HOST: "tranga-pg"
      POSTGRES_PORT: "5432"
      POSTGRES_USER: "${POSTGRESUSER}"
      POSTGRES_PASSWORD: "${POSTGRESPASSWORD}"
      POSTGRES_DATABASE: "tranga"
      RABBITMQ_HOST: "messaging"
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: "tranga"
      RABBITMQ_PASSWORD: "tranga"
      UseAuth: "${USEAUTH}"
      AUTH_SIGNING_KEY: "${AUTHSIGNINGKEY}"
      AllowNSFW: "${ALLOWNSFW}"
      DownloadLanguage: "${DOWNLOADLANGUAGE}"
      FLARESOLVERR_URL: "${FLARESOLVERRURL}"
    expose:
      - "${SERVICES_MANGA_PORT}"
    volumes:
      - type: "volume"
        target: "/app/Covers"
        source: "Covers"
    depends_on:
      tranga-pg:
        condition: "service_started"
      messaging:
        condition: "service_healthy"
    networks:
      - "tranga"
    restart: "on-failure:3"
  services-notifications:
    image: "ghcr.io/c9glax/tranga-services_notifications:external-connectors"
    environment:
      OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY: "in_memory"
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      HTTP_PORTS: "${SERVICES_NOTIFICATIONS_PORT}"
      ConnectionStrings__tranga: "Host=tranga-pg;Port=5432;Username=${POSTGRESUSER};Password=${POSTGRESPASSWORD};Database=tranga"
      TRANGA_HOST: "tranga-pg"
      TRANGA_PORT: "5432"
      TRANGA_USERNAME: "${POSTGRESUSER}"
      TRANGA_PASSWORD: "${POSTGRESPASSWORD}"
      TRANGA_URI: "postgresql://${POSTGRESUSER}:${POSTGRESPASSWORD}@tranga-pg:5432/tranga"
      TRANGA_JDBCCONNECTIONSTRING: "jdbc:postgresql://tranga-pg:5432/tranga"
      TRANGA_DATABASENAME: "tranga"
      ConnectionStrings__messaging: "amqp://${RABBITMQUSER}:${RABBITMQPASSWORD}@messaging:5672"
      MESSAGING_HOST: "messaging"
      MESSAGING_PORT: "5672"
      MESSAGING_USERNAME: "${RABBITMQUSER}"
      MESSAGING_PASSWORD: "${RABBITMQPASSWORD}"
      MESSAGING_URI: "amqp://${RABBITMQUSER}:${RABBITMQPASSWORD}@messaging:5672"
      POSTGRES_HOST: "tranga-pg"
      POSTGRES_PORT: "5432"
      POSTGRES_USER: "${POSTGRESUSER}"
      POSTGRES_PASSWORD: "${POSTGRESPASSWORD}"
      POSTGRES_DATABASE: "tranga"
      RABBITMQ_HOST: "messaging"
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: "tranga"
      RABBITMQ_PASSWORD: "tranga"
      UseAuth: "${USEAUTH}"
      AUTH_SIGNING_KEY: "${AUTHSIGNINGKEY}"
    expose:
      - "${SERVICES_NOTIFICATIONS_PORT}"
    depends_on:
      tranga-pg:
        condition: "service_started"
      messaging:
        condition: "service_healthy"
    networks:
      - "tranga"
    restart: "on-failure:3"
  services-libraries:
    image: "ghcr.io/c9glax/tranga-services_libraries:external-connectors"
    environment:
      OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY: "in_memory"
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      HTTP_PORTS: "${SERVICES_LIBRARIES_PORT}"
      ConnectionStrings__tranga: "Host=tranga-pg;Port=5432;Username=${POSTGRESUSER};Password=${POSTGRESPASSWORD};Database=tranga"
      TRANGA_HOST: "tranga-pg"
      TRANGA_PORT: "5432"
      TRANGA_USERNAME: "${POSTGRESUSER}"
      TRANGA_PASSWORD: "${POSTGRESPASSWORD}"
      TRANGA_URI: "postgresql://${POSTGRESUSER}:${POSTGRESPASSWORD}@tranga-pg:5432/tranga"
      TRANGA_JDBCCONNECTIONSTRING: "jdbc:postgresql://tranga-pg:5432/tranga"
      TRANGA_DATABASENAME: "tranga"
      ConnectionStrings__messaging: "amqp://${RABBITMQUSER}:${RABBITMQPASSWORD}@messaging:5672"
      MESSAGING_HOST: "messaging"
      MESSAGING_PORT: "5672"
      MESSAGING_USERNAME: "${RABBITMQUSER}"
      MESSAGING_PASSWORD: "${RABBITMQPASSWORD}"
      MESSAGING_URI: "amqp://${RABBITMQUSER}:${RABBITMQPASSWORD}@messaging:5672"
      POSTGRES_HOST: "tranga-pg"
      POSTGRES_PORT: "5432"
      POSTGRES_USER: "${POSTGRESUSER}"
      POSTGRES_PASSWORD: "${POSTGRESPASSWORD}"
      POSTGRES_DATABASE: "tranga"
      RABBITMQ_HOST: "messaging"
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: "tranga"
      RABBITMQ_PASSWORD: "tranga"
      UseAuth: "${USEAUTH}"
      AUTH_SIGNING_KEY: "${AUTHSIGNINGKEY}"
    expose:
      - "${SERVICES_LIBRARIES_PORT}"
    volumes:
      - type: "volume"
        target: "/app/Covers"
        source: "Covers"
        read_only: true
    depends_on:
      tranga-pg:
        condition: "service_started"
      messaging:
        condition: "service_healthy"
    networks:
      - "tranga"
    restart: "on-failure:3"
  services-auth:
    image: "ghcr.io/c9glax/tranga-services_auth:external-connectors"
    environment:
      OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY: "in_memory"
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      HTTP_PORTS: "${SERVICES_AUTH_PORT}"
      ConnectionStrings__tranga: "Host=tranga-pg;Port=5432;Username=${POSTGRESUSER};Password=${POSTGRESPASSWORD};Database=tranga"
      TRANGA_HOST: "tranga-pg"
      TRANGA_PORT: "5432"
      TRANGA_USERNAME: "${POSTGRESUSER}"
      TRANGA_PASSWORD: "${POSTGRESPASSWORD}"
      TRANGA_URI: "postgresql://${POSTGRESUSER}:${POSTGRESPASSWORD}@tranga-pg:5432/tranga"
      TRANGA_JDBCCONNECTIONSTRING: "jdbc:postgresql://tranga-pg:5432/tranga"
      TRANGA_DATABASENAME: "tranga"
      ConnectionStrings__messaging: "amqp://${RABBITMQUSER}:${RABBITMQPASSWORD}@messaging:5672"
      MESSAGING_HOST: "messaging"
      MESSAGING_PORT: "5672"
      MESSAGING_USERNAME: "${RABBITMQUSER}"
      MESSAGING_PASSWORD: "${RABBITMQPASSWORD}"
      MESSAGING_URI: "amqp://${RABBITMQUSER}:${RABBITMQPASSWORD}@messaging:5672"
      POSTGRES_HOST: "tranga-pg"
      POSTGRES_PORT: "5432"
      POSTGRES_USER: "${POSTGRESUSER}"
      POSTGRES_PASSWORD: "${POSTGRESPASSWORD}"
      POSTGRES_DATABASE: "tranga"
      RABBITMQ_HOST: "messaging"
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: "tranga"
      RABBITMQ_PASSWORD: "tranga"
      UseAuth: "${USEAUTH}"
      AUTH_SIGNING_KEY: "${AUTHSIGNINGKEY}"
    expose:
      - "${SERVICES_AUTH_PORT}"
    depends_on:
      tranga-pg:
        condition: "service_started"
      messaging:
        condition: "service_healthy"
    networks:
      - "tranga"
    restart: "on-failure:3"
  frontend:
    image: "ghcr.io/c9glax/tranga-frontend:external-connectors"
    environment:
      NODE_ENV: "production"
      PORT: "3000"
      SERVICES_MANGA_HTTP: "http://services-manga:${SERVICES_MANGA_PORT}"
      services__services-manga__http__0: "http://services-manga:${SERVICES_MANGA_PORT}"
      SERVICES_MANGA_HTTPS: "https://services-manga:${SERVICES_MANGA_PORT}"
      SERVICES_TASKS_HTTP: "http://services-tasks:${SERVICES_TASKS_PORT}"
      services__services-tasks__http__0: "http://services-tasks:${SERVICES_TASKS_PORT}"
      SERVICES_TASKS_HTTPS: "https://services-tasks:${SERVICES_TASKS_PORT}"
    expose:
      - "3000"
    depends_on:
      services-manga:
        condition: "service_started"
      services-tasks:
        condition: "service_started"
    networks:
      - "tranga"
  gateway:
    image: "mcr.microsoft.com/dotnet/nightly/yarp:2.3-preview"
    command:
      - "/app/yarp.dll"
    entrypoint:
      - "dotnet"
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      FRONTEND_HTTP: "http://frontend:3000"
      REVERSEPROXY__ROUTES__route0__MATCH__METHODS__0: "GET"
      REVERSEPROXY__ROUTES__route0__MATCH__PATH: "/{**catchall}"
      REVERSEPROXY__ROUTES__route0__CLUSTERID: "cluster_frontend"
      REVERSEPROXY__ROUTES__route1__MATCH__PATH: "/api/mangas/{**catch-all}"
      REVERSEPROXY__ROUTES__route1__CLUSTERID: "cluster_services-manga"
      REVERSEPROXY__ROUTES__route1__TRANSFORMS__0__PathRemovePrefix: "/api"
      REVERSEPROXY__ROUTES__route2__MATCH__PATH: "/api/tasks/{**catch-all}"
      REVERSEPROXY__ROUTES__route2__CLUSTERID: "cluster_services-tasks"
      REVERSEPROXY__ROUTES__route2__TRANSFORMS__0__PathRemovePrefix: "/api"
      REVERSEPROXY__ROUTES__route3__MATCH__PATH: "/api/notifications/{**catch-all}"
      REVERSEPROXY__ROUTES__route3__CLUSTERID: "cluster_services-notifications"
      REVERSEPROXY__ROUTES__route3__TRANSFORMS__0__PathRemovePrefix: "/api"
      REVERSEPROXY__ROUTES__route4__MATCH__PATH: "/api/libraries/{**catch-all}"
      REVERSEPROXY__ROUTES__route4__CLUSTERID: "cluster_services-libraries"
      REVERSEPROXY__ROUTES__route4__TRANSFORMS__0__PathRemovePrefix: "/api"
      REVERSEPROXY__ROUTES__route5__MATCH__PATH: "/api/auth/{**catch-all}"
      REVERSEPROXY__ROUTES__route5__CLUSTERID: "cluster_services-auth"
      REVERSEPROXY__ROUTES__route5__TRANSFORMS__0__PathRemovePrefix: "/api"
      REVERSEPROXY__CLUSTERS__cluster_frontend__DESTINATIONS__destination1__ADDRESS: "http://frontend"
      REVERSEPROXY__CLUSTERS__cluster_services-manga__DESTINATIONS__destination1__ADDRESS: "https+http://services-manga"
      REVERSEPROXY__CLUSTERS__cluster_services-tasks__DESTINATIONS__destination1__ADDRESS: "https+http://services-tasks"
      REVERSEPROXY__CLUSTERS__cluster_services-notifications__DESTINATIONS__destination1__ADDRESS: "https+http://services-notifications"
      REVERSEPROXY__CLUSTERS__cluster_services-libraries__DESTINATIONS__destination1__ADDRESS: "https+http://services-libraries"
      REVERSEPROXY__CLUSTERS__cluster_services-auth__DESTINATIONS__destination1__ADDRESS: "https+http://services-auth"
      services__frontend__http__0: "http://frontend:3000"
      SERVICES_MANGA_HTTP: "http://services-manga:${SERVICES_MANGA_PORT}"
      services__services-manga__http__0: "http://services-manga:${SERVICES_MANGA_PORT}"
      SERVICES_MANGA_HTTPS: "https://services-manga:${SERVICES_MANGA_PORT}"
      SERVICES_TASKS_HTTP: "http://services-tasks:${SERVICES_TASKS_PORT}"
      services__services-tasks__http__0: "http://services-tasks:${SERVICES_TASKS_PORT}"
      SERVICES_TASKS_HTTPS: "https://services-tasks:${SERVICES_TASKS_PORT}"
      SERVICES_NOTIFICATIONS_HTTP: "http://services-notifications:${SERVICES_NOTIFICATIONS_PORT}"
      services__services-notifications__http__0: "http://services-notifications:${SERVICES_NOTIFICATIONS_PORT}"
      SERVICES_NOTIFICATIONS_HTTPS: "https://services-notifications:${SERVICES_NOTIFICATIONS_PORT}"
      SERVICES_LIBRARIES_HTTP: "http://services-libraries:${SERVICES_LIBRARIES_PORT}"
      services__services-libraries__http__0: "http://services-libraries:${SERVICES_LIBRARIES_PORT}"
      SERVICES_LIBRARIES_HTTPS: "https://services-libraries:${SERVICES_LIBRARIES_PORT}"
      SERVICES_AUTH_HTTP: "http://services-auth:${SERVICES_AUTH_PORT}"
      services__services-auth__http__0: "http://services-auth:${SERVICES_AUTH_PORT}"
      SERVICES_AUTH_HTTPS: "https://services-auth:${SERVICES_AUTH_PORT}"
    ports:
      - "5000:5000"
    expose:
      - "5000"
    depends_on:
      frontend:
        condition: "service_started"
    networks:
      - "tranga"
networks:
  aspire:
    driver: "bridge"
  tranga:
    driver: "bridge"
volumes:
  Covers: {}
